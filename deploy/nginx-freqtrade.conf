server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/freqtrade.crt;
    ssl_certificate_key /etc/nginx/ssl/freqtrade.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    root /var/www/criptotools-ui;
    index index.html;

    location /api/freqai/ {
        proxy_pass http://127.0.0.1:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400;
    }

    location /api/strategy/ {
        proxy_pass http://127.0.0.1:8081/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400;
    }

    location /api/grid/ {
        proxy_pass http://127.0.0.1:8082/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400;
    }

    location /api/pair-config/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600;
        proxy_connect_timeout 30;
        proxy_send_timeout 600;
    }

    # FreqUI (served under /frequi/) uses absolute /api/v1/ and /assets/ paths
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8080/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:8080/favicon.ico;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /frequi/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        sub_filter_types text/html;
        sub_filter_once on;
        sub_filter '</body>' '<div style="position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;justify-content:center;align-items:center;gap:12px;padding:8px 16px;background:#1a2332;border-bottom:1px solid #2d3a4f;font-family:Segoe UI,system-ui,sans-serif;font-size:14px;color:#e7ecf3"><span>Классический FreqUI</span><a href="/" style="color:#3b82f6;font-weight:600;text-decoration:none">← Новая панель CriptoTools</a></div><style>#app{margin-top:42px!important}</style></body>';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
