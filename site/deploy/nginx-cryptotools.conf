server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name 77.222.35.209;

    ssl_certificate     /etc/letsencrypt/live/77.222.35.209/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/77.222.35.209/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    root /var/www/criptotools-ui;
    index index.html;

    location /api/finder/ {
        proxy_pass http://127.0.0.1:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400;
    }

    location /api/strategy/ {
        proxy_pass http://127.0.0.1:8081/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400;
    }

    location /api/grid/ {
        proxy_pass http://127.0.0.1:8082/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 86400;
    }

    location /api/pair-config/ {
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 600;
        proxy_connect_timeout 30;
        proxy_send_timeout 600;
    }

    # Household chores app (Next.js on :3010). ^~ beats static try_files.
    location ^~ /chores {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Skincare checklist app (static). ^~ beats static try_files.
    location ^~ /uhod/ {
        root /var/www;
        try_files $uri $uri/ /uhod/index.html;
    }

    location = /uhod {
        return 301 /uhod/;
    }

    location ~ ^/frequi(/|$) {
        return 404;
    }

    location /api/v1/ {
        return 404;
    }

    location /assets/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
